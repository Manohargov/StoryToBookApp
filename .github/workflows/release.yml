name: Release

# Build installers for Windows and macOS and attach them to a GitHub release.
#
#   Trigger:  push a tag such as v1.0.0, or publish a release from the UI.
#   Manual:   workflow_dispatch lets you build without publishing.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release with the installers"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Generate the icon
        run: python packaging/make_icon.py packaging/assets

      - name: Build the application folder
        shell: pwsh
        run: |
          $env:STORYTOBOOK_ONEFILE = "0"
          $env:STORYTOBOOK_BUNDLE_AUDIO = "1"
          python -m PyInstaller packaging/storytobook.spec --noconfirm --clean `
            --distpath dist --workpath build

      - name: Verify the frozen build
        shell: pwsh
        run: |
          $report = "selftest.txt"
          ./dist/StoryToBook/StoryToBook.exe --selftest --report $report
          if ($LASTEXITCODE -ne 0) { Get-Content $report; exit 1 }
          Get-Content $report

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppDir=$PWD\dist\StoryToBook" "/DMyVersion=1.0.0" packaging/storytobook.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist/installer

      - name: Package the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/StoryToBook -DestinationPath "dist/StoryToBook-1.0.0-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: storytobook-windows
          path: |
            dist/installer/*.exe
            dist/StoryToBook-1.0.0-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS application
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Generate the icon
        run: python packaging/make_icon.py packaging/assets

      - name: Build the application bundle
        run: python packaging/build_macos.py

      - name: Verify the frozen build
        run: |
          ./dist/StoryToBook.app/Contents/MacOS/StoryToBook --selftest --report selftest.txt
          cat selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: storytobook-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        run: ls -lh artifacts

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            ## StoryToBook

            Turn a spoken story into a finished, typeset book.

            ### Windows

            - `*-windows-x64-setup.exe` - the installer. Run it and the app is
              added to the Start Menu with an uninstaller.
            - `*-windows-x64.zip` - the portable build. Unpack it and run
              `StoryToBook.exe`.

            ### macOS

            - `*-macos-*.dmg` - drag `StoryToBook.app` into Applications.
            - `*-macos-*.zip` - the raw application bundle.

            The macOS build is not signed with an Apple Developer ID, so the
            first launch shows a Gatekeeper warning. Choose *right click ->
            Open*, or run `xattr -cr /Applications/StoryToBook.app`.

            ### What is included

            The installers contain the editor, the built-in cover designer and
            the PDF, EPUB and HTML exporters. The optional AI engines are not
            bundled because of their size: install *Whisper* or *Stable
            Diffusion* separately, or use the OpenAI cloud engines from the
            Settings screen.
